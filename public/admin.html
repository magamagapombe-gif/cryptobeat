<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CryptoBeat Admin — KYC Review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050709;color:#f1f5f9;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;padding:0}
.topbar{background:#0b0f18;border-bottom:1px solid #1e293b;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:14px;font-weight:700;color:#f0b429;letter-spacing:2px}
.admin-badge{font-size:11px;background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.3);padding:4px 12px;letter-spacing:1px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 53px)}
.login-card{background:#0b0f18;border:1px solid #1e293b;padding:2rem;width:100%;max-width:360px;margin:2rem}
.login-title{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.login-sub{font-size:12px;color:#94a3b8;margin-bottom:1.5rem;font-family:monospace}
input{width:100%;background:#111827;border:1px solid #263347;color:#f1f5f9;padding:12px 14px;font-size:14px;outline:none;margin-bottom:1rem}
input:focus{border-color:#f0b429}
.btn{width:100%;padding:13px;background:#f0b429;color:#000;border:none;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:1px}
.btn:active{opacity:.85}
.btn.danger{background:#f43f5e;color:#fff}
.btn.success{background:#10b981;color:#fff}
.btn.small{padding:8px 16px;width:auto;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.main{padding:24px;max-width:1200px;margin:0 auto}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.page-sub{font-size:12px;color:#94a3b8;font-family:monospace;margin-bottom:1.5rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border:1px solid #1e293b}
.tab{padding:10px 20px;background:transparent;border:none;color:#94a3b8;font-size:13px;font-family:monospace;letter-spacing:1px;cursor:pointer}
.tab.active{background:rgba(240,180,41,.08);color:#f0b429;border-bottom:2px solid #f0b429}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem}
.stat{background:#0b0f18;border:1px solid #1e293b;padding:14px;text-align:center}
.stat-num{font-size:1.8rem;font-weight:700;color:#f0b429}
.stat-label{font-size:10px;color:#94a3b8;letter-spacing:2px;margin-top:4px;font-family:monospace}
.user-card{background:#0b0f18;border:1px solid #1e293b;padding:16px;margin-bottom:12px}
.user-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.user-name{font-weight:600;font-size:1rem}
.user-phone{font-size:12px;color:#94a3b8;font-family:monospace;margin-top:2px}
.status-badge{font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:2px;font-family:monospace}
.status-badge.PENDING{background:rgba(240,180,41,.1);color:#f0b429;border:1px solid rgba(240,180,41,.3)}
.status-badge.APPROVED{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.status-badge.REJECTED{background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
.user-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px;font-size:12px}
.detail-label{color:#94a3b8;font-family:monospace;font-size:10px;letter-spacing:1px;margin-bottom:2px}
.detail-val{color:#f1f5f9}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.photo-box{background:#111827;border:1px solid #1e293b;overflow:hidden}
.photo-label{font-size:10px;color:#94a3b8;font-family:monospace;letter-spacing:1px;padding:6px 10px;border-bottom:1px solid #1e293b}
.photo-box img{width:100%;display:block;max-height:220px;object-fit:contain;cursor:pointer}
.photo-placeholder{height:120px;display:flex;align-items:center;justify-content:center;color:#475569;font-family:monospace;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:3rem;color:#475569;font-family:monospace;font-size:12px;letter-spacing:1px}
.toast{position:fixed;top:16px;right:16px;padding:12px 18px;border-radius:2px;font-family:monospace;font-size:12px;z-index:999;animation:fadeIn .2s}
.toast.success{background:#064e3b;border:1px solid #10b981;color:#10b981}
.toast.error{background:#4c0519;border:1px solid #f43f5e;color:#f43f5e}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;background:transparent;border:1px solid #475569;color:#f1f5f9;width:36px;height:36px;font-size:18px;cursor:pointer}
.note-input{width:100%;background:#111827;border:1px solid #263347;color:#f1f5f9;padding:8px 12px;font-size:12px;font-family:monospace;outline:none;margin-bottom:8px}
@media(max-width:600px){.photos{grid-template-columns:1fr}.user-header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CRYPTOBEAT</div>
  <div class="admin-badge">ADMIN PANEL</div>
</div>

<!-- Login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-title">Admin Access</div>
    <div class="login-sub">// KYC REVIEW DASHBOARD</div>
    <input type="password" id="secret-input" placeholder="Enter admin secret" onkeydown="if(event.key==='Enter')login()"/>
    <button class="btn" onclick="login()">ACCESS DASHBOARD</button>
  </div>
</div>

<!-- Dashboard -->
<div class="main" id="dashboard" style="display:none">
  <div class="page-title">KYC Review Dashboard</div>
  <div class="page-sub" id="last-refresh">Loading...</div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">PENDING</div></div>
    <div class="stat"><div class="stat-num" id="stat-approved">—</div><div class="stat-label">APPROVED</div></div>
    <div class="stat"><div class="stat-num" id="stat-rejected">—</div><div class="stat-label">REJECTED</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('PENDING', this)">PENDING</button>
    <button class="tab" onclick="switchTab('APPROVED', this)">APPROVED</button>
    <button class="tab" onclick="switchTab('REJECTED', this)">REJECTED</button>
  </div>

  <div id="user-list"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src=""/>
</div>

<script>
'use strict';
let ADMIN_SECRET = '';
let currentTab = 'PENDING';
let allUsers = { PENDING: [], APPROVED: [], REJECTED: [] };

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function login() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) { toast('Enter the admin secret', 'error'); return; }
  ADMIN_SECRET = val;
  loadData();
}

async function apiAdmin(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + ADMIN_SECRET,
      ...(opts.headers || {})
    }
  });
  return r.json();
}

async function loadData() {
  try {
    const [pending, approved, rejected] = await Promise.all([
      apiAdmin('/api/admin/kyc?status=PENDING'),
      apiAdmin('/api/admin/kyc?status=APPROVED'),
      apiAdmin('/api/admin/kyc?status=REJECTED'),
    ]);

    if (!pending.ok) {
      toast('Wrong secret or unauthorized', 'error');
      return;
    }

    allUsers.PENDING  = pending.data.users  || [];
    allUsers.APPROVED = approved.data.users || [];
    allUsers.REJECTED = rejected.data.users || [];

    document.getElementById('stat-pending').textContent  = allUsers.PENDING.length;
    document.getElementById('stat-approved').textContent = allUsers.APPROVED.length;
    document.getElementById('stat-rejected').textContent = allUsers.REJECTED.length;
    document.getElementById('last-refresh').textContent  = '// Last refreshed: ' + new Date().toLocaleTimeString();

    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display  = 'block';

    renderUsers();
  } catch (e) {
    toast('Failed to load data', 'error');
  }
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderUsers();
}

function renderUsers() {
  const list = document.getElementById('user-list');
  const users = allUsers[currentTab];

  if (!users.length) {
    list.innerHTML = '<div class="empty">NO ' + currentTab + ' SUBMISSIONS</div>';
    return;
  }

  list.innerHTML = users.map(u => {
    const dob = u.date_of_birth ? new Date(u.date_of_birth).toLocaleDateString() : '—';
    const submitted = new Date(u.created_at).toLocaleString();
    const reviewed = u.kyc_reviewed_at ? new Date(u.kyc_reviewed_at).toLocaleString() : '—';

    return `
    <div class="user-card" id="card-${u.id}">
      <div class="user-header">
        <div>
          <div class="user-name">${u.full_legal_name || u.name}</div>
          <div class="user-phone">${u.phone}</div>
        </div>
        <span class="status-badge ${u.national_id_status}">${u.national_id_status}</span>
      </div>
      <div class="user-details">
        <div><div class="detail-label">NATIONAL ID</div><div class="detail-val">${u.national_id_number || '—'}</div></div>
        <div><div class="detail-label">DATE OF BIRTH</div><div class="detail-val">${dob}</div></div>
        <div><div class="detail-label">SUBMITTED</div><div class="detail-val">${submitted}</div></div>
        <div><div class="detail-label">REVIEWED</div><div class="detail-val">${reviewed}</div></div>
      </div>
      <div class="photos">
        <div class="photo-box">
          <div class="photo-label">FRONT OF ID</div>
          ${u.front_photo_url
            ? `<img src="${u.front_photo_url}" onclick="openLightbox('${u.front_photo_url}')" title="Click to enlarge"/>`
            : '<div class="photo-placeholder">NO PHOTO</div>'
          }
        </div>
        <div class="photo-box">
          <div class="photo-label">BACK OF ID</div>
          ${u.back_photo_url
            ? `<img src="${u.back_photo_url}" onclick="openLightbox('${u.back_photo_url}')" title="Click to enlarge"/>`
            : '<div class="photo-placeholder">NO PHOTO</div>'
          }
        </div>
      </div>
      ${currentTab === 'PENDING' ? `
      <input class="note-input" type="text" id="note-${u.id}" placeholder="Optional review note..."/>
      <div class="actions">
        <button class="btn success small" onclick="review('${u.id}', 'APPROVE')">✅ APPROVE</button>
        <button class="btn danger small" onclick="review('${u.id}', 'REJECT')">❌ REJECT</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

async function review(userId, action) {
  const note = document.getElementById('note-' + userId)?.value || '';
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Processing...';

  try {
    const res = await apiAdmin('/api/admin/kyc', {
      method: 'POST',
      body: JSON.stringify({ user_id: userId, action, note })
    });

    if (res.ok) {
      toast(action === 'APPROVE' ? '✅ User approved!' : '❌ User rejected!',
            action === 'APPROVE' ? 'success' : 'error');
      // Remove from pending list
      allUsers.PENDING = allUsers.PENDING.filter(u => u.id !== userId);
      document.getElementById('stat-pending').textContent = allUsers.PENDING.length;
      document.getElementById('card-' + userId).remove();
      if (!allUsers.PENDING.length) {
        document.getElementById('user-list').innerHTML = '<div class="empty">NO PENDING SUBMISSIONS</div>';
      }
    } else {
      toast(res.error || 'Action failed', 'error');
      btn.disabled = false;
      btn.textContent = action === 'APPROVE' ? '✅ APPROVE' : '❌ REJECT';
    }
  } catch {
    toast('Network error', 'error');
    btn.disabled = false;
  }
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// Auto-refresh every 60 seconds
setInterval(() => { if (ADMIN_SECRET) loadData(); }, 60000);
</script>
</body>
</html>
